<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10294f">
  <title>طلب الكرياتين | MGREFOTS</title>
  <style>
    :root{font-family:Inter,"Noto Sans Arabic",Arial,sans-serif;color:#10294f;background:#f8f5ed;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,600px);background:#fff;border:1px solid #e7e2d7;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #10294f18}
    header{background:#10294f;color:#fff;padding:25px 30px}header b{letter-spacing:2px;font-size:20px}header span{display:block;margin-top:6px;color:#d7e1ea;font-size:14px}
    main{padding:28px 30px 32px}h1{margin:0 0 8px;font-size:27px}.intro{color:#59697a;line-height:1.7;margin:0 0 22px}
    form{display:grid;gap:14px}label{display:grid;gap:7px;font-weight:600;font-size:14px}input{font:inherit;width:100%;border:1px solid #d7dce1;border-radius:10px;padding:12px 13px;background:white;outline:none}input:focus{border-color:#07847e;box-shadow:0 0 0 3px #07847e20}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qty{max-width:145px}
    button{border:0;border-radius:11px;background:#f2b823;color:#10294f;font:inherit;font-weight:800;padding:14px 18px;cursor:pointer;margin-top:5px}button:disabled{opacity:.65;cursor:wait}
    #notice{margin:0;line-height:1.6}.success{color:#087f54}.error{color:#ad302b}footer{text-align:center;color:#74808c;font-size:12px;padding:0 20px 22px}
    @media(max-width:520px){body{padding:12px}.card{border-radius:16px}header,main{padding-left:20px;padding-right:20px}.grid{grid-template-columns:1fr}h1{font-size:23px}}
  </style>
</head>
<body>
  <section class="card" aria-labelledby="title">
    <header><b>M.G.REFOTS</b><span>DIETARY SUPPLEMENTS · KIGALI</span></header>
    <main>
      <h1 id="title">طلب كرياتين مونوهيدرات</h1>
      <p class="intro">املأ بياناتك لإرسال طلب الكرياتين. ستصلك رسالة لتأكيد التوفر والتوصيل والدفع.</p>
      <form id="order-form">
        <label>الاسم الكامل<input name="name" autocomplete="name" maxlength="100" required></label>
        <label>رقم الهاتف<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+250 7xx xxx xxx" maxlength="24" dir="ltr" required></label>
        <div class="grid">
          <label>المدينة<input name="city" autocomplete="address-level2" maxlength="80" required></label>
          <label>المنطقة / الحي<input name="area" autocomplete="address-level3" maxlength="100" required></label>
        </div>
        <label>الشارع / المبنى<input name="street" autocomplete="street-address" maxlength="160" required></label>
        <label>الكمية (عبوات)<input class="qty" name="quantity" type="number" min="1" max="99" step="1" value="1" required></label>
        <button id="submit" type="submit">إرسال طلب الكرياتين</button>
        <p id="notice" role="status" aria-live="polite"></p>
      </form>
    </main>
    <footer>MGREFOTS LTD · سيتم التواصل معك لتأكيد تفاصيل الطلب</footer>
  </section>
  <script>
    const form=document.getElementById('order-form'),button=document.getElementById('submit'),notice=document.getElementById('notice');
    form.addEventListener('submit',async event=>{
      event.preventDefault();button.disabled=true;notice.className='';notice.textContent='جارٍ إرسال الطلب…';
      const data=new FormData(form),body=Object.fromEntries(data.entries());
      try{
        const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          name:body.name,phone:body.phone,city:body.city,area:body.area,street:body.street,
          orderType:'creatine-only',items:[{product:'creatine',quantity:Number(body.quantity)}],website:''
        })});
        const result=await response.json();
        if(!response.ok)throw new Error(result.message||'تعذر إرسال الطلب. حاول مرة أخرى.');
        form.hidden=true;notice.className='success';notice.textContent='تم إرسال طلبك بنجاح. سنتواصل معك لتأكيد التفاصيل.';
      }catch(error){notice.className='error';notice.textContent=error.message||'تعذر إرسال الطلب. حاول مرة أخرى.';button.disabled=false}
    });
  </script>
</body>
</html>
